<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Símbolo: dois semicírculos (branco esquerda, vermelho direita) + ponto turquesa -->
  <defs>
    <style>
      .logo-white { fill: white; }
      .logo-red { fill: #EF3B36; }
      .logo-teal { fill: #00A89A; }
    </style>
  </defs>

  <!-- Semicírculo branco (esquerda) -->
  <path class="logo-white" d="M 100 50 Q 70 50 70 100 Q 70 150 100 150 L 100 50 Z" stroke="none"/>

  <!-- Semicírculo vermelho (direita) -->
  <path class="logo-red" d="M 100 50 Q 130 50 130 100 Q 130 150 100 150 L 100 50 Z" stroke="none"/>

  <!-- Ponto turquesa central -->
  <circle class="logo-teal" cx="100" cy="100" r="12"/>
</svg>
