<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Símbolo branco: dois semicírculos (cinza claro esquerda, branco direita) + ponto branco -->
  <defs>
    <style>
      .logo-light { fill: #F5F5F5; }
      .logo-white { fill: white; }
      .logo-accent { fill: #00A89A; }
    </style>
  </defs>

  <!-- Semicírculo cinza claro (esquerda) -->
  <path class="logo-light" d="M 100 50 Q 70 50 70 100 Q 70 150 100 150 L 100 50 Z" stroke="none"/>

  <!-- Semicírculo branco (direita) -->
  <path class="logo-white" d="M 100 50 Q 130 50 130 100 Q 130 150 100 150 L 100 50 Z" stroke="none"/>

  <!-- Ponto turquesa central -->
  <circle class="logo-accent" cx="100" cy="100" r="12"/>
</svg>
