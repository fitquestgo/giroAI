<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicon: Símbolo Giro AI compacto -->
  <defs>
    <style>
      .favicon-white { fill: white; }
      .favicon-red { fill: #EF3B36; }
      .favicon-teal { fill: #00A89A; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1a1a1a"/>

  <!-- Semicírculo branco (esquerda) -->
  <path class="favicon-white" d="M 32 16 Q 20 16 20 32 Q 20 48 32 48 L 32 16 Z"/>

  <!-- Semicírculo vermelho (direita) -->
  <path class="favicon-red" d="M 32 16 Q 44 16 44 32 Q 44 48 32 48 L 32 16 Z"/>

  <!-- Ponto turquesa central -->
  <circle class="favicon-teal" cx="32" cy="32" r="5"/>
</svg>
